<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>WP Girls Wrestling Check-In</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-title" content="WP Girls">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#0f1b2d; --ink2:#44536a; --line:#d5dbe5; --bg:#eef1f6; --card:#fff;
  --brand:#111111; --brand2:#111111; --accent:#c8102e;
  --ok:#157a3c; --ok-bg:#dff5e6; --late:#8a5300; --late-bg:#ffedc7; --exc:#1e4fa3; --exc-bg:#dfe9fb; --bad:#b3261e; --bad-bg:#fde3e1;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:96px}
.top{background:var(--brand);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5;border-bottom:5px solid var(--accent)}
.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
.top .sub{font-size:14px;opacity:.85}
.pad{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.card h2{margin:0 0 10px;font-size:16px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2)}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:12px;background:var(--brand2);color:#fff;font-size:19px;font-weight:700;padding:12px 16px}
.btn:active{filter:brightness(.9)}
.btn.sec{background:#fff;color:var(--brand2);border:2px solid var(--brand2)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:600;font-size:16px;min-height:48px}
.btn.danger{background:#fff;color:var(--bad);border:2px solid var(--bad)}
.btn.ok{background:var(--ok)}
.btn[disabled]{opacity:.5}
.btn + .btn{margin-top:10px}
.link{background:none;border:0;color:var(--brand2);text-decoration:underline;padding:12px 8px;font-size:15px;min-height:44px}
.field{display:block;width:100%;min-height:56px;border:2px solid #8793a6;border-radius:12px;padding:10px 14px;font-size:20px;background:#fff}
.field:focus{outline:3px solid rgba(200,16,46,.4);border-color:var(--brand2)}
.big-id{font-size:34px;text-align:center;letter-spacing:4px;font-weight:700}
label.l{display:block;font-weight:600;margin:0 0 6px}
.hint{color:var(--ink2);font-size:15px;margin:8px 0 0}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;margin:10px 0 0;font-weight:600}

/* athlete hero */
.hero{border-radius:16px;padding:26px 18px;text-align:center;margin:0 0 14px;border:3px solid transparent}
.hero .ic{font-size:76px;line-height:1;font-weight:800}
.hero .t{font-size:30px;font-weight:800;margin:6px 0 2px;letter-spacing:.3px}
.hero .n{font-size:22px;font-weight:700}
.hero .d{font-size:17px;margin-top:4px}
.hero.ok{background:var(--ok);color:#fff}
.hero.late{background:var(--late-bg);color:#5c3700;border-color:#c98a1b}
.hero.bad{background:var(--bad);color:#fff}
.hero.info{background:#fff;color:var(--ink);border-color:var(--line)}
.spin{width:54px;height:54px;border:6px solid #d9d9d9;border-top-color:var(--accent);border-radius:50%;margin:8px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.wrow{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
.wrow > div{flex:1}
.wrow .btn{width:auto;min-width:96px}
.saved{color:var(--ok);font-weight:700}

/* coach */
.datebar{display:flex;align-items:center;gap:8px;margin-top:8px}
.datebar button{min-width:48px;min-height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font-size:20px;font-weight:700}
.datebar .dt{flex:1;text-align:center;font-size:19px;font-weight:700}
.datebar .tod{font-size:14px;padding:0 10px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;min-height:68px}
.tile b{display:block;font-size:26px;line-height:1.1}
.tile span{font-size:13px;color:var(--ink2);font-weight:600}
.tile.on{border-color:var(--brand2);background:#ececec}
.tile.t-out b{color:var(--bad)} .tile.t-here b{color:var(--ok)} .tile.t-late b{color:var(--late)} .tile.t-exc b{color:var(--exc)}
.note{border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:15px;background:#fff;border:1px solid var(--line)}
.note.code{background:#fff8d6;border-color:#d9b400;font-size:17px}
.note.code b{font-size:26px;letter-spacing:3px}
.rows{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:62px;padding:8px 12px 8px 10px;border:0;border-bottom:1px solid var(--line);border-left:8px solid #c4ccd9;background:#fff;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:#f0f0f0}
.row .nm{flex:1;font-weight:700;font-size:18px;min-width:0}
.row .nm small{display:block;font-weight:500;font-size:13px;color:var(--ink2)}
.row .nm .warn{color:var(--bad);font-weight:700}
.pill{flex:none;border-radius:999px;padding:7px 12px;font-size:15px;font-weight:700;white-space:nowrap;border:2px solid transparent}
.p-none{border-color:#8793a6;border-style:dashed;color:var(--ink2);background:#fff}
.p-P{background:var(--ok-bg);color:var(--ok)} .p-L{background:var(--late-bg);color:var(--late)}
.p-E{background:var(--exc-bg);color:var(--exc)} .p-A{background:var(--bad-bg);color:var(--bad)}
.row.s-P{border-left-color:var(--ok)} .row.s-L{border-left-color:#d08a00} .row.s-E{border-left-color:var(--exc)} .row.s-A{border-left-color:var(--bad)}
.row.pending{opacity:.6}
.empty{padding:26px 16px;text-align:center;color:var(--ink2)}
.sech{font-size:13px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--ink2);margin:16px 4px 6px}
.wt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:#fff;min-height:62px}
.wt:last-child{border-bottom:0}
.wt .nm{flex:1;font-weight:700;min-width:0;font-size:16px}
.wt .nm small{display:block;font-weight:500;font-size:13px;color:var(--ink2)}
.wt input{width:74px;min-height:48px;border:2px solid #8793a6;border-radius:10px;text-align:center;font-size:18px;font-weight:700;background:#fff;padding:4px}
.wt input:focus{outline:3px solid rgba(200,16,46,.4);border-color:var(--brand2)}
.wt .chg{width:62px;text-align:right;font-weight:800;font-size:15px}
.wt .chg.flag{color:var(--bad)}
.wthead{display:flex;gap:8px;padding:6px 10px;font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
.wthead span:first-child{flex:1} .wthead span{width:74px;text-align:center} .wthead span:last-child{width:62px;text-align:right}

.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav div{display:flex;width:100%;max-width:600px}
.nav button{flex:1;min-height:62px;border:0;background:none;font-size:13px;font-weight:700;color:var(--ink2);border-top:4px solid transparent}
.nav button i{display:block;font-style:normal;font-size:22px;line-height:1.2}
.nav button.on{color:var(--brand2);border-top-color:var(--accent)}

.count{border-radius:16px;padding:18px;text-align:center;margin-bottom:12px;border:3px solid var(--bad);background:var(--bad-bg);color:#7c1610}
.count .n{font-size:54px;font-weight:800;line-height:1}
.count .n small{font-size:26px}
.count .m{font-size:17px;font-weight:700;margin-top:6px}
.count.ready{border-color:#c98a1b;background:var(--late-bg);color:#5c3700}
.count.go{border-color:var(--ok);background:var(--ok);color:#fff}
.seg{display:flex;border:2px solid var(--brand2);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;min-height:50px;border:0;background:#fff;color:var(--brand2);font-weight:700;font-size:16px}
.seg button.on{background:var(--brand2);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-height:44px;border-radius:999px;border:2px solid var(--line);background:#fff;padding:6px 14px;font-weight:700;font-size:15px;color:var(--ink2)}
.chip.on{border-color:var(--brand2);background:var(--brand2);color:#fff}
.rep{display:flex;align-items:center;gap:8px;width:100%;min-height:60px;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}
.rep:last-child{border-bottom:0}
.rep .nm{flex:1;min-width:0;font-weight:700;font-size:16px}
.rep .nm small{display:block;font-weight:600;font-size:13px;color:var(--ink2)}
.rep .pc{width:58px;text-align:right;font-size:20px;font-weight:800}
.pc.g{color:var(--ok)} .pc.y{color:var(--late)} .pc.r{color:var(--bad)}
.marks{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.marks i{width:13px;height:13px;border-radius:3px;display:block}
.m-P{background:#2aa35a} .m-L{background:#e0a100} .m-E{background:#6d94dd} .m-A{background:#d6453d}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:0 4px 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);text-align:left;padding:6px 4px;border-bottom:2px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.t .flag{color:var(--bad);font-weight:800}
.check{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 12px;border-bottom:1px solid var(--line);background:#fff;font-weight:600}
.check input{width:26px;height:26px;flex:none}
.switch{display:flex;align-items:center;gap:12px;justify-content:space-between;min-height:52px}
.switch button{flex:none;min-width:92px;min-height:46px;border-radius:999px;border:2px solid #8793a6;background:#fff;font-weight:800;color:var(--ink2)}
.switch button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pick{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:#fff;min-height:62px}
.pick:last-child{border-bottom:0}
.pick .nm{flex:1;min-width:0;font-weight:700;font-size:16px}
.pick .nm small{display:block;font-weight:500;font-size:13px;color:var(--ink2)}
.lvs{display:flex;gap:6px;flex:none}
.lv{min-width:48px;min-height:46px;border-radius:10px;border:2px solid #8793a6;background:#fff;font-weight:800;font-size:14px;color:var(--ink2);padding:0 8px}
.lv.on{background:#111;border-color:#111;color:#fff}
.tr{border:1px solid #333;font-size:15px;color:#000;background:#fff}
.trb{background:#0d0d0d;color:#ff4a40;font-weight:800;text-align:center;padding:18px 8px 6px}
.trh,.trr{display:grid;grid-template-columns:86px 1fr;border-top:1px solid #333}
.trh{background:#f00;font-weight:600}
.trh span,.trr span{padding:4px 7px}
.trh span:first-child,.trr span:first-child{border-right:1px solid #333}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{margin-top:0}
.fold{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;margin-top:12px;padding:8px 2px 0;border:0;border-top:1px solid var(--line);background:none;font-weight:700;font-size:16px;color:var(--ink2);text-align:left}
.fold small{font-weight:600;font-size:14px}
.cyc .check{border:2px solid #8793a6;border-radius:12px;min-height:56px;font-size:18px;font-weight:700;margin-top:6px}
.plist{margin:0 0 12px;padding:0;list-style:none;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plist li{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.plist li:last-child{border-bottom:0}
.plist small{display:block;font-weight:500;font-size:13px;color:var(--ink2)}

#sheet{position:fixed;inset:0;background:rgba(10,18,32,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.open{display:flex}
#sheet .box{background:#fff;width:100%;max-width:600px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
#sheet h3{margin:0 0 4px;font-size:22px}
#sheet p{margin:0 0 12px;color:var(--ink2)}
#toast{position:fixed;left:12px;right:12px;bottom:78px;display:none;justify-content:center;z-index:30;pointer-events:none}
#toast.open{display:flex}
#toast div{pointer-events:auto;background:#101a2b;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;max-width:560px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast button{min-height:44px;border:2px solid #fff;background:none;color:#fff;border-radius:10px;font-weight:800;padding:4px 14px}
#toast.bad div{background:var(--bad)}

.poster{background:#fff;min-height:100vh;text-align:center;padding:28px 20px;color:#000}
.poster h1{font-size:34px;margin:0 0 4px} .poster h2{font-size:54px;margin:8px 0 12px;letter-spacing:1px}
.poster .qr{width:min(78vw,520px);margin:0 auto} .poster .qr svg{width:100%;height:auto;display:block}
.poster ol{display:inline-block;text-align:left;font-size:24px;line-height:1.6;margin:14px auto 8px;padding-left:28px}
.poster .u{font-size:12px;color:#444;word-break:break-all;margin-top:10px}
.qrbox{background:#fff;padding:8px;border-radius:12px;max-width:420px;margin:0 auto} .qrbox svg{width:100%;height:auto;display:block}
@media print{.noprint{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="box" id="sheetbox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="../qrcode.js"></script>
<script>
(function(){
'use strict';
var QS=new URLSearchParams(location.search);
var BOOT={mode:QS.get('p')==='coach'?'coach':QS.get('p')==='poster'?'poster':'athlete',team:window.WP_TEAM||'Wrestling',url:location.origin+location.pathname,today:ymd(new Date())};
var $app = document.getElementById('app'), $sheet = document.getElementById('sheet'), $box = document.getElementById('sheetbox'), $toast = document.getElementById('toast');

/* ---------- utilities ---------- */
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var KEY=String(window.WP_KEY||'wp_');   // a second team's page sets WP_KEY so its saved ID and coach PIN stay apart from this one's
function sk(k){return KEY==='wp_'?k:KEY+k.replace(/^wp_/,'');}
function get(k){k=sk(k);try{return localStorage.getItem(k)||'';}catch(e){return mem[k]||'';}}
function set(k,v){k=sk(k);mem[k]=v;try{if(v===''||v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
var mem={};
function api(fn){
  var args=[].slice.call(arguments,1);
  if(!window.WP_API)return Promise.resolve({ok:false,error:'NET',message:'The app is not connected to the Sheet yet. Tell Coach.'});
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var t=setTimeout(function(){if(ctl)ctl.abort();},30000);
  return fetch(window.WP_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow',signal:ctl?ctl.signal:undefined})
    .then(function(r){if(!r.ok)throw new Error('http');return r.json();})
    .then(function(j){clearTimeout(t);return j||{ok:false,error:'NET',message:'No answer from the server. Try again.'};})
    .catch(function(){clearTimeout(t);return {ok:false,error:'NET',message:'Could not reach the server. Check your signal and try again.'};});
}
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(s){var p=s.split('-');return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]),12);}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ymd(d);}
function nice(s){if(!s)return'';var d=pd(s);return DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate();}
function t12(s){var m=/^(\d{1,2}):(\d{2})/.exec(s||'');if(!m)return s||'';var h=Number(m[1]);return ((h+11)%12+1)+':'+m[2]+(h<12?' AM':' PM');}
function weekStart(s){var d=pd(s);var k=(d.getDay()+6)%7;return addDays(s,-k);}
function monthStart(s){return s.slice(0,8)+'01';}
function deviceId(){var d=get('wp_dev');if(!d){d='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);set('wp_dev',d);}return d;}
function qrSvg(url){try{var q=qrcode(0,'M');q.addData(url);q.make();return q.createSvgTag({cellSize:8,margin:4,scalable:true});}catch(e){return '';}}

function toast(msg,undo,bad){
  clearTimeout(toast.t);
  $toast.className='open'+(bad?' bad':'');
  $toast.innerHTML='<div><span>'+E(msg)+'</span>'+(undo?'<button data-a="undo">UNDO</button>':'')+'</div>';
  toast.undo=undo||null;
  toast.t=setTimeout(function(){$toast.className='';},bad?7000:5000);
}
function openSheet(html){$box.innerHTML=html;$sheet.className='open';var f=$box.querySelector('[autofocus]');if(f)setTimeout(function(){f.focus();},50);}
function closeSheet(){$sheet.className='';$box.innerHTML='';}
function sheetOpen(){return $sheet.className==='open';}

/* ====================================================================== */
/*  ATHLETE                                                               */
/* ====================================================================== */
var A={sid:get('wp_sid'),me:null,view:'',busy:false,err:'',cand:null,msg:{}};

/* Works with an older Sheet script too: fall back to the practice-only rules when the new fields are missing. */
function canIn(m){return m.canCheckIn!=null?m.canCheckIn:(!m.status&&m.open);}
function isIn(m){return m.checkedIn!=null?m.checkedIn:(m.status==='Present'||m.status==='Late');}
function athleteStart(){
  if(!A.sid){A.view='id';return renderAthlete();}
  A.view='home';A.busy=true;A.err='';A.xerr='';A.what='auto';A.cyc=false;renderAthlete();
  api('athleteState',A.sid,deviceId()).then(function(r){
    if(!r.ok){
      A.busy=false;
      if(r.error==='NOT_FOUND'){set('wp_sid','');A.sid='';A.view='id';A.err=r.message;}else{A.err=r.message;}
      return renderAthlete();
    }
    A.me=r.me;
    if(!A.me.staff&&canIn(A.me)&&pmode()!=='code')return tryCheckIn('auto');
    A.busy=false;renderAthlete();
  });
}
function pmode(){return (A.me&&A.me.presence)||'off';}
/* Ask the phone where it is. Resolves {lat,lng,acc}; rejects with a plain-language reason. */
function locate(){
  return new Promise(function(res,rej){
    if(!navigator.geolocation)return rej('This phone cannot share its location.');
    navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});},
      function(e){rej(e&&e.code===1?'Location is turned off for this page. Allow location, then try again.':'This phone could not find its location.');},
      {enableHighAccuracy:true,timeout:15000,maximumAge:30000});
  });
}
function tryCheckIn(what){
  A.what=what||'auto';
  if(pmode()==='off')return doCheckIn({});
  A.busy=true;A.busyMsg='Finding your location…';A.err='';A.xerr='';renderAthlete();
  locate().then(function(pos){doCheckIn(pos);},function(why){
    var msg=why+(pmode()==='loc'?' Or ask Coach for the backup code.':' Or see Coach to be marked.');
    A.busy=false;A.busyMsg='';if(A.what==='extra')A.xerr=msg;else A.err=msg;renderAthlete();
  });
}
function doCheckIn(proof){
  A.busy=true;A.busyMsg='';A.err='';A.xerr='';renderAthlete();
  api('athleteCheckIn',A.sid,deviceId(),proof,A.what||'auto').then(function(r){
    A.busy=false;
    if(r.me)A.me=r.me;
    if(!r.ok){if(A.what==='extra')A.xerr=r.message;else A.err=r.message;}
    renderAthlete();
  });
}
function head(sub){return '<div class="top"><h1>'+E(BOOT.team)+'</h1>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';}

function renderAthlete(){
  var h=head('Athlete check-in')+'<div class="pad">';
  if(A.view==='id'){
    h+='<div class="card"><label class="l" for="sid" style="font-size:22px">Enter your Student ID</label>'+
       '<input id="sid" class="field big-id" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="10" placeholder="000000">'+
       (A.err?'<div class="err">'+E(A.err)+'</div>':'')+
       '<p class="hint">You only do this once on this phone.</p></div>'+
       '<button class="btn" data-a="idNext"'+(A.busy?' disabled':'')+'>'+(A.busy?'Looking you up…':'Continue')+'</button>';
  } else if(A.view==='confirm'){
    h+='<div class="hero info"><div class="d">Is this you?</div><div class="t">'+E(A.cand.name)+'</div><div class="d">ID '+E(A.cand.id)+'</div></div>'+
       '<button class="btn ok" data-a="idYes">Yes, that\'s me</button><button class="btn sec" data-a="idNo">No, go back</button>';
  } else {
    h+=heroHtml()+extraHtml()+weightHtml()+busHtml();
    if(A.me)h+='<div style="text-align:center"><button class="link" data-a="switch">Not '+E(A.me.first)+'? Switch athlete</button></div>';
  }
  h+='<div style="text-align:center;margin-top:18px"><button class="link" data-a="coachMode" style="color:#44536a">Coach</button></div></div>';
  $app.innerHTML=h;
  var f=document.getElementById('sid')||(pmode()==='code'?document.getElementById('code'):null);
  if(f&&!A.busy)f.focus();
}
function heroHtml(){
  var m=A.me;
  if(A.busy&&!m)return '<div class="hero info"><div class="spin"></div><div class="d">One moment…</div></div>';
  if(A.busy)return '<div class="hero info"><div class="spin"></div><div class="t">'+E(A.busyMsg||'Checking you in…')+'</div><div class="n">'+E(m.name)+'</div></div>';
  if(!m)return '<div class="hero bad"><div class="ic">!</div><div class="t">NOT CHECKED IN</div><div class="d">'+E(A.err||'Could not load.')+'</div></div><button class="btn" data-a="retry">Try again</button><p class="hint" style="text-align:center;margin-bottom:14px">Still not working? Tell Coach — Coach can mark you here.</p>';
  var when=nice(m.date);
  if(m.staff)return '<div class="hero info"><div class="t">Hi '+E(m.first)+'</div><div class="n">Manager / student assistant</div><div class="d">No practice check-in for you. On trip days your bus button shows up here.</div></div>';
  var can=canIn(m), xs=m.extras||[];
  var xl=xs.map(function(x){return '<div class="d" style="font-weight:700">✓ '+E(x.name)+' (optional)'+(x.time?' · '+E(t12(x.time)):'')+'</div>';}).join('');
  if(m.status==='Present')return '<div class="hero ok"><div class="ic">✓</div><div class="t">CHECKED IN</div><div class="n">'+E(m.name)+'</div><div class="d">'+E(t12(m.time))+' · '+E(when)+'</div>'+xl+'</div>';
  if(m.status==='Late')return '<div class="hero late"><div class="ic">✓</div><div class="t">CHECKED IN — LATE</div><div class="n">'+E(m.name)+'</div><div class="d">'+E(t12(m.time))+' · '+E(when)+'</div>'+xl+'</div>';
  if(m.status==='Excused'||m.status==='Absent')return '<div class="hero info"><div class="t">Coach marked you '+E(m.status)+'</div><div class="n">'+E(m.name)+'</div><div class="d">'+E(when)+' · If that is wrong, see Coach.</div>'+xl+'</div>';
  if(A.err&&!(pmode()==='code'&&can))return '<div class="hero bad"><div class="ic">!</div><div class="t">NOT CHECKED IN</div><div class="n">'+E(m.name)+'</div><div class="d">'+E(A.err)+'</div></div>'+(can?'<button class="btn" data-a="retry" style="margin-bottom:14px">Try again</button>':'')+
    (can&&pmode()==='loc'?'<div class="card"><label class="l" for="code">Backup code from Coach</label><div class="wrow" style="margin:0"><div><input id="code" class="field" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off"></div><button class="btn sec" data-a="codeGo">Use code</button></div></div>':'');
  if(xs.length&&!can)return '<div class="hero ok"><div class="ic">✓</div><div class="t">CHECKED IN</div><div class="n">'+E(m.name)+'</div>'+xl+'<div class="d">'+E(when)+'</div></div>'+
    (m.practice&&m.closedReason?'<div class="note">'+E(m.closedReason)+(/opens at/.test(m.closedReason)?' Open this page again then to check in for practice.':'')+'</div>':'');
  if(!can)return '<div class="hero info"><div class="t">'+(m.practice?'Practice today '+E(t12(m.practice.start)):'No practice today')+'</div><div class="n">'+E(m.name)+'</div><div class="d">'+E(m.closedReason)+'</div></div>';
  if(pmode()!=='code')return '<div class="hero info"><div class="t">Hi '+E(m.first)+'</div><div class="d">'+E(nice(m.date))+'</div></div><button class="btn" data-a="retry" style="margin-bottom:14px">Check in</button>';
  return '<div class="card"><div style="font-size:22px;font-weight:800;margin-bottom:8px">Hi '+E(m.first)+'</div><label class="l" for="code">Type the 2-digit room code Coach is showing</label>'+
         '<input id="code" class="field big-id" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off">'+(A.err?'<div class="err">'+E(A.err)+'</div>':'')+'</div>'+
         '<button class="btn" data-a="codeGo" style="margin-bottom:14px">Check in</button>';
}
/* The open optional session, when a scan did not already put this athlete in it (practice check-in was open). */
function extraHtml(){
  var m=A.me,s=m&&m.session; if(!s||A.busy||m.staff||(!s.offer&&!A.xerr))return '';
  var box='<input id="xcode" class="field" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off">';
  var h='<div class="card"><h2>'+E(s.name)+' · optional</h2>';
  if(s.offer)h+=(pmode()==='code'?'<label class="l" for="xcode">Type the 2-digit code Coach is showing</label>'+box+'<div style="height:10px"></div>':'')+
    '<button class="btn sec" data-a="extraGo">I\'m also here for '+E(s.name)+'</button><p class="hint">Open until '+E(t12(s.until))+'. It does not change your practice attendance.</p>';
  if(A.xerr)h+='<div class="err">'+E(A.xerr)+'</div>'+(s.offer&&pmode()==='loc'?'<label class="l" for="xcode" style="margin-top:12px">Backup code from Coach</label><div class="wrow" style="margin:0"><div>'+box+'</div><button class="btn sec" data-a="xcodeGo">Use code</button></div>':'');
  return h+'</div>';
}
function weightHtml(){
  var m=A.me; if(!m||A.busy||m.staff)return '';
  if(!isIn(m))return '<div class="card"><h2>Weigh-in (pounds)</h2><p class="hint" style="margin:0">Weights open after you check in.</p></div>';
  function one(kind,label,val){
    return '<div class="wrow"><div><label class="l" for="w'+kind+'">'+label+'</label><input id="w'+kind+'" class="field" inputmode="decimal" placeholder="lb" value="'+E(val)+'"></div>'+
           '<button class="btn '+(val?'sec':'')+'" data-a="wtSave" data-kind="'+kind+'">'+(val?'Update':'Save')+'</button></div>';
  }
  var h='<div class="card"><h2>Weigh-in (pounds)</h2>'+one('pre','Before practice',m.pre)+one('post','After practice',m.post);
  if(m.pre&&m.post)h+='<div class="saved">Change today: '+(Number(m.change)>0?'+':'')+E(m.change)+' lb</div>';
  if(A.msg.wt)h+='<div class="'+(A.msg.wtBad?'err':'saved')+'" style="margin-top:8px">'+E(A.msg.wt)+'</div>';
  return h+cycleHtml()+'</div>';
}
/* Only sent by the Sheet to the phone that checked this athlete in today, and only for a team that uses it.
   It stays folded until she opens it, because this screen gets shown to coaches and teammates as proof of check-in. */
function cycleHtml(){
  var c=A.me&&A.me.cycle; if(!c)return '';
  return '<button class="fold" data-a="cycFold" aria-expanded="'+(A.cyc?'true':'false')+'" aria-controls="cycp"><span>Cycle log</span><small>Private · '+(A.cyc?'tap to close':'tap to open')+'</small></button>'+
    '<div class="cyc" id="cycp"'+(A.cyc?'':' hidden')+'><label class="check" for="cyc"><input type="checkbox" id="cyc" data-c="cyc"'+(c.on?' checked':'')+'><span>On cycle today</span></label>'+
    '<div id="cycst" class="hint">Your choice. It goes only to your coach\'s private log, never to the team list.</div></div>';
}
function busHtml(){
  var m=A.me; if(!m||!m.trip||A.busy)return '';
  var t=m.trip, leg=t.leg==='Return'?'Ride home':'Leaving';
  var h='<div class="card"><h2>Bus · '+E(t.name)+' · '+leg+'</h2>';
  if(t.status==='On')h+='<div class="hero ok" style="margin:0;padding:16px"><div class="t" style="font-size:24px">✓ ON THE BUS</div><div class="d">'+E(t12(t.time))+'</div></div>';
  else if(t.status==='Released')h+='<div class="hero info" style="margin:0;padding:16px"><div class="d">Coach marked you <b>not riding</b>. If that is wrong, see Coach now.</div></div>';
  else h+=(pmode()==='code'?'':'<button class="btn" data-a="board">I\'m getting on the bus</button>')+(A.msg.bus?'<div class="err">'+E(A.msg.bus)+'</div>':'')+
    (pmode()==='code'||(pmode()==='loc'&&A.msg.bus)?'<label class="l" for="bcode" style="margin-top:12px">'+(pmode()==='code'?'Type the 2-digit code Coach is showing':'Backup code from Coach')+'</label><div class="wrow" style="margin:0"><div><input id="bcode" class="field" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off"></div><button class="btn sec" data-a="boardCode">Board</button></div>':'');
  return h+'</div>';
}

function doBoard(proof){
  A.busy=true;A.busyMsg='Getting you on the bus…';renderAthlete();
  api('athleteBoard',A.sid,deviceId(),proof).then(function(r){A.busy=false;A.busyMsg='';if(r.me)A.me=r.me;A.msg=r.ok?{}:{bus:r.message};renderAthlete();});
}

var C={pin:get('wp_pin'),tab:'today',date:'',day:null,filter:'',q:'',sticky:{},pending:0,loading:false,err:'',
       trips:null,trip:null,form:null,rep:null,range:'week',from:'',to:'',sort:'pct',ath:null,more:'',roster:null};

function coachStart(){
  if(!C.pin)return renderLogin('');
  renderLoading('Opening coach screens…');
  api('coachLogin',C.pin).then(function(r){
    if(!r.ok){ if(r.error==='PIN'){set('wp_pin','');C.pin='';return renderLogin('');} return renderLoading(r.message,true); }
    BOOT.today=r.today;C.date=r.today;C.cycle=!!r.cycle;go('today');
  });
}
function renderLoading(msg,retry){$app.innerHTML=head('Coach')+'<div class="pad"><div class="hero info">'+(retry?'':'<div class="spin"></div>')+'<div class="d">'+E(msg)+'</div></div>'+(retry?'<button class="btn" data-a="coachRetry">Try again</button>':'')+'</div>';}
function renderLogin(err){
  $app.innerHTML=head('Coach')+'<div class="pad"><div class="card"><label class="l" for="pin" style="font-size:22px">Coach PIN</label>'+
    '<input id="pin" class="field big-id" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12">'+(err?'<div class="err">'+E(err)+'</div>':'')+
    '<p class="hint">The PIN is in the Config tab of the attendance Sheet.</p></div><button class="btn" data-a="pinGo">Open coach screens</button>'+
    '<div style="text-align:center"><button class="link" data-a="athMode">Back to athlete check-in</button></div></div>';
  document.getElementById('pin').focus();
}
function guard(r){ if(r&&r.error==='PIN'){set('wp_pin','');C.pin='';renderLogin('PIN changed. Enter the new coach PIN.');return false;} return true; }
function nav(){
  var tabs=[['today','☑','Today'],['weights','⚖','Weights'],['bus','🚌','Travel'],['reports','▤','Reports'],['more','⋯','More']];
  return '<nav class="nav"><div>'+tabs.map(function(t){return '<button data-a="tab" data-t="'+t[0]+'" class="'+(C.tab===t[0]?'on':'')+'"'+(C.tab===t[0]?' aria-current="page"':'')+'><i aria-hidden="true">'+t[1]+'</i>'+t[2]+'</button>';}).join('')+'</div></nav>';
}
function go(tab){
  C.tab=tab;C.err='';C.sticky={};C.ath=null;C.sess=null;C.cyc=null;clearTimeout(toast.t);$toast.className='';
  if(tab==='today'||tab==='weights'){loadDay(true);}
  else if(tab==='bus'){C.trip=null;C.form=null;if(C.date!==BOOT.today){C.date=BOOT.today;C.day=null;C.filter='';}loadTrips();if(!C.day)loadDay(false,true);}
  else if(tab==='reports'){setRange(C.range);}
  else {C.more='';if(C.date!==BOOT.today){C.date=BOOT.today;C.day=null;C.filter='';}renderMore();if(!C.day)loadDay(false,true);}
  window.scrollTo(0,0);
}
function loadDay(show,quiet){
  if(show){C.loading=true;renderDay();}
  return api('coachDay',C.pin,C.date).then(function(r){
    C.loading=false;
    if(!guard(r))return;
    if(!r.ok){C.err=r.message;if(!quiet)renderDay();return;}
    if(C.pending>0)return;
    C.err='';C.day=r;
    if(!C.filter)C.filter=r.isToday?'out':'all';
    if(!quiet&&(C.tab==='today'||C.tab==='weights'))renderDay(true);
    if(C.tab==='more'&&!C.more)renderMore();
  });
}
function K(s){return s==='Present'?'P':s==='Late'?'L':s==='Excused'?'E':s==='Absent'?'A':'';}
function counts(){
  var c={here:0,late:0,exc:0,out:0};
  (C.day?C.day.athletes:[]).forEach(function(a){
    if(a.status==='Present'||a.status==='Late')c.here++; if(a.status==='Late')c.late++;
    if(a.status==='Excused')c.exc++; if(!a.status||a.status==='Absent')c.out++;
  });
  return c;
}
function dateBar(){
  var d=C.day, isT=C.date===BOOT.today;
  return '<div class="datebar"><button data-a="day" data-n="-1" aria-label="Previous day">‹</button><div class="dt">'+E(nice(C.date))+(isT?' · Today':'')+'</div>'+
    (isT?'':'<button class="tod" data-a="dayToday">Today</button>')+'<button data-a="day" data-n="1" aria-label="Next day"'+(isT?' disabled style="opacity:.35"':'')+'>›</button></div>';
}
function renderDay(keep){
  if(C.tab==='weights')return renderWeights(keep);
  if(C.sess)return renderSess(keep);
  var d=C.day, y=keep?window.scrollY:0;
  var h='<div class="top"><h1>'+E(BOOT.team)+' · Attendance</h1>'+dateBar()+'</div><div class="pad">';
  if(C.err)h+='<div class="err" style="margin:0 0 12px">'+E(C.err)+' <button class="link" data-a="reload">Reload</button></div>';
  if(!d){h+='<div class="hero info"><div class="spin"></div><div class="d">Loading roster…</div></div></div>'+nav();$app.innerHTML=h;return;}
  var c=counts();
  h+='<div class="tiles">'+
     tile('out',c.out,'Not here')+tile('here',c.here,'Here')+tile('late',c.late,'Late')+tile('exc',c.exc,'Excused')+'</div>';
  if(d.isToday&&d.presence==='code')h+='<div class="note code">Room code today: <b>'+E(d.code)+'</b> — say it out loud or write it on the board.</div>';
  if(d.isToday&&d.presence==='loc')h+='<div class="note code">Backup code today: <b>'+E(d.code)+'</b> — only for an athlete whose phone cannot get its location.</div>';
  if(d.isToday&&(d.presence==='loc'||d.presence==='loconly')&&!d.schoolSet)h+='<div class="err" style="margin:0 0 12px">The school location is not set, so phones cannot be checked. Go to More and set it while you are in the wrestling room.</div>';
  h+='<button class="note" data-a="more" data-m="sched" style="display:flex;width:100%;align-items:center;gap:10px;text-align:left;cursor:pointer;min-height:52px"><span style="flex:1">'+(d.practice?'<b>Practice '+E(t12(d.practice.start))+'–'+E(t12(d.practice.end))+'</b>'+(d.practice.note?' · '+E(d.practice.note):''):'<b>No practice scheduled</b> for '+E(nice(C.date)))+'</span><span class="pill p-none" style="border-style:solid">'+(d.practice?'Change':'Set / open')+'</span></button>';
  (d.sessions||[]).forEach(function(x){
    h+='<button class="note" data-a="sessOpen" data-id="'+E(x.id)+'" style="display:flex;width:100%;align-items:center;gap:10px;text-align:left;cursor:pointer;min-height:52px"><span style="flex:1">'+
      (x.open?'<b style="color:#157a3c">● '+E(x.name)+'</b> · optional · open until '+E(t12(x.end)):'<b>'+E(x.name)+'</b> · optional'+(x.end?' · ended '+E(t12(x.end)):''))+'</span><span class="pill '+(x.count?'p-P':'p-none')+'" style="border-style:solid">'+x.count+' in</span></button>';
  });
  if(d.sessions&&!d.sessions.some(function(x){return x.open;}))h+='<button class="btn ghost" data-a="sessNew" style="margin:0 0 12px">'+(d.isToday?'+ Optional session (weight room, recovery…)':'+ Record an optional session for this day')+'</button>';
  if(d.isToday)h+='<div class="note">'+(d.open?'<b style="color:#157a3c">● Athlete check-in is open.</b> Tap a name to mark someone yourself.':'<b>Athlete check-in is closed.</b> '+E(d.closedReason)+' You can still tap names.')+'</div>';
  h+='<input class="field" id="q" data-i="search" placeholder="Search name" value="'+E(C.q)+'" autocomplete="off" style="margin-bottom:12px;min-height:50px;font-size:18px">';
  h+='<div id="list"></div><div style="text-align:center"><button class="link" data-a="filterAll">'+(C.filter==='all'?'':'Show everyone')+'</button></div></div>'+nav();
  $app.innerHTML=h;renderList();
  if(keep)window.scrollTo(0,y);
}
function tile(k,n,label){return '<button class="tile t-'+k+(C.filter===k?' on':'')+'" data-a="filter" data-f="'+k+'" aria-pressed="'+(C.filter===k)+'"><b>'+n+'</b><span>'+label+'</span></button>';}
function inFilter(a){
  if(C.sticky[a.id])return true;
  if(C.filter==='out')return !a.status||a.status==='Absent';
  if(C.filter==='here')return a.status==='Present'||a.status==='Late';
  if(C.filter==='late')return a.status==='Late';
  if(C.filter==='exc')return a.status==='Excused';
  return true;
}
function tags(a){return 'Gr '+E(a.grade||'?')+(a.cleared?'':' · <span class="warn">Not cleared</span>')+(a.method==='Self-Code'?' · used backup code':'')+(a.x&&a.x.length?' · + '+E(a.x.join(', ')):'')+(a.note?' · '+E(a.note):'');}
function pill(a){
  var k=K(a.status);
  if(!k)return '<span class="pill p-none">Tap = here</span>';
  var txt={P:'✓ Here',L:'◷ Late',E:'E Excused',A:'✕ Absent'}[k];
  return '<span class="pill p-'+k+'">'+txt+(a.time&&(k==='P'||k==='L')?' '+E(t12(a.time)):'')+'</span>';
}
function renderList(){
  var el=document.getElementById('list'); if(!el||!C.day)return;
  var q=C.q.trim().toLowerCase();
  var list=C.day.athletes.filter(function(a){return q?a.name.toLowerCase().indexOf(q)>=0:inFilter(a);});
  if(!list.length){
    var msg=q?'No one matches "'+E(C.q)+'".':C.filter==='out'?'Everyone is accounted for. ✓':'No one in this group yet.';
    el.innerHTML='<div class="rows"><div class="empty">'+msg+'</div></div>';return;
  }
  el.innerHTML='<div class="rows">'+list.map(function(a){
    return '<button class="row s-'+K(a.status)+(a._p?' pending':'')+'" data-a="tapAth" data-id="'+E(a.id)+'"><span class="nm">'+E(a.name)+'<small>'+tags(a)+'</small></span>'+pill(a)+'</button>';
  }).join('')+'</div>';
}
function findA(id){return C.day.athletes.filter(function(a){return a.id===id;})[0];}
function mark(id,status,note,silent){
  var a=findA(id); if(!a)return;
  var prev={status:a.status,time:a.time,note:a.note};
  a.status=status; if(note!=null)a.note=note; a._p=true; C.sticky[id]=true; C.pending++;
  renderDay(true);
  api('coachMark',C.pin,C.date,id,status,note==null?null:note).then(function(r){
    C.pending--; a._p=false;
    if(!guard(r))return;
    if(!r.ok){a.status=prev.status;a.time=prev.time;a.note=prev.note;renderDay(true);return toast('NOT SAVED: '+r.message,null,true);}
    renderDay(true);
    if(!silent)toast(a.name+' — '+(status?({Present:'here',Late:'late',Excused:'excused',Absent:'absent'}[status]):'mark cleared'),function(){mark(id,prev.status,prev.note,true);});
    if(C.pending===0)loadDay(false);
  });
}
function athSheet(id){
  var a=findA(id);
  openSheet('<h3>'+E(a.name)+'</h3><p>'+tags(a)+' · '+E(nice(C.date))+'</p>'+
    '<div class="grid2"><button class="btn ok" data-a="setSt" data-id="'+E(id)+'" data-s="Present">✓ Here</button><button class="btn" style="background:#b56f00" data-a="setSt" data-id="'+E(id)+'" data-s="Late">◷ Late</button>'+
    '<button class="btn" style="background:#1e4fa3;margin-top:0" data-a="setSt" data-id="'+E(id)+'" data-s="Excused">Excused</button><button class="btn" style="background:#b3261e;margin-top:0" data-a="setSt" data-id="'+E(id)+'" data-s="Absent">✕ Absent</button></div>'+
    '<label class="l" for="note" style="margin-top:14px">Note (optional)</label><input id="note" class="field" maxlength="120" placeholder="doctor, tutoring, injury…" value="'+E(a.note)+'" style="font-size:17px;min-height:50px">'+
    '<div style="margin-top:14px">'+(a.status?'<button class="btn ghost" data-a="setSt" data-id="'+E(id)+'" data-s="">Clear today\'s mark</button>':'')+
    '<button class="btn ghost" data-a="openAth" data-id="'+E(id)+'">Attendance & weight history</button><button class="btn ghost" data-a="close">Cancel</button></div>');

function chgTxt(a,flag){ if(a.chg==='')return ''; return (Number(a.chg)>0?'+':'')+E(a.chg)+(flag?'<br>'+E(a.pct)+'%':''); }
function saveWt(el,force){
  var id=el.getAttribute('data-id'), kind=el.getAttribute('data-kind'), a=findA(id), v=el.value.trim().replace(',','.');
  if(!a||v===String(a[kind]||''))return;
  if(v!==''){
    var n=Number(v);
    if(!isFinite(n)||n<70||n>450){el.value=a[kind]||'';return toast('Not saved: enter pounds between 70 and 450.',null,true);}
    var ref=Number(kind==='post'&&a.pre?a.pre:a.last);
    if(!force&&ref&&Math.abs(n-ref)/ref>0.06){
      C.wtEl=el;
      return openSheet('<h3>Check that number</h3><p><b>'+E(v)+' lb</b> for '+E(a.name)+' is '+Math.abs(Math.round((n-ref)*10)/10)+' lb different from '+(kind==='post'&&a.pre?'the before-practice weight':'the last weigh-in')+' ('+E(ref)+' lb).</p>'+
        '<button class="btn" data-a="wtYes">It\'s right — save '+E(v)+'</button><button class="btn sec" data-a="wtNo">Fix it</button>');
    }
  }
  C.pending++; el.style.opacity=.5;
  api('coachWeight',C.pin,C.date,id,kind,v).then(function(r){
    C.pending--; el.style.opacity=1;
    if(!guard(r))return;
    if(!r.ok){el.value=a[kind]||'';return toast('NOT SAVED: '+r.message,null,true);}
    a.pre=r.pre;a.post=r.post;a.chg=r.chg;a.pct=r.pct;el.value=a[kind];
    var c=document.getElementById('chg'+id), flag=a.pct!==''&&Number(a.pct)<=-C.day.flagPct;
    if(c){c.className='chg'+(flag?' flag':'');c.innerHTML=chgTxt(a,flag);}
    el.style.borderColor='#157a3c';
  });

function cycSave(fn,id,arg1,arg2,reopen,done){

  cycToday:function(ds){cycSave('Mark',ds.id,C.cyc.data.today,!!ds.on,true);},
  cycDay:function(ds){
    var v=(document.getElementById('cycd')||{}).value||'';
    if(!v){var m=document.getElementById('cycerr');if(m)m.innerHTML='<div class="err">Pick the day first.</div>';return;}
    cycSave('Mark',ds.id,v,!!ds.on,true);
  },
  cycEraseAsk:function(ds){var a=C.cyc.data.athletes.filter(function(x){return x.id===ds.id;})[0];openSheet('<h3>Erase the cycle log for '+E(a?a.name:'this athlete')+'?</h3><p>Every day logged for her is deleted from the Sheet. This cannot be undone.</p><button class="btn danger" data-a="cycErase" data-id="'+E(ds.id)+'">Erase her log</button><button class="btn ghost" data-a="cycAth" data-id="'+E(ds.id)+'">Keep it</button>');},
  cycErase:function(ds){cycSave('Erase',ds.id,undefined,undefined,false,'Her log is erased.');},
  sort:function(ds){C.sort=ds.s;renderReports();},
  'export':function(el){
    toast('Writing the report to the Sheet…');
    api('coachExport',C.pin,C.from,C.to).then(function(r){ if(!guard(r))return; if(!r.ok)return toast('NOT SAVED: '+r.message,null,true);
      openSheet('<h3>Report is in the Sheet</h3><p>'+r.rows+' athletes × '+r.days+' practices, on the tab named <b>Report</b>. Print it or share it from there.</p>'+(r.url?'<a class="btn" style="text-align:center;text-decoration:none;line-height:32px" href="'+E(r.url)+'" target="_blank" rel="noopener">Open the Sheet</a>':'')+'<button class="btn ghost" data-a="close">Done</button>'); });
  },
  deactAsk:function(){openSheet('<h3>Remove '+E(C.ath.data.name)+'?</h3><p>They leave the daily list and reports. Their history is kept and you can put them back any time.</p><button class="btn danger" data-a="deact">Remove from active roster</button><button class="btn ghost" data-a="close">Cancel</button>');},
  deact:function(){closeSheet();setActive(false);},
  react:function(){setActive(true);},
  more:function(ds){C.tab='more';C.more=ds.m;C.err='';renderMore();window.scrollTo(0,0);if(ds.m==='sched'){C.sched=null;C.schedMonday=C.schedMonday||weekStart(BOOT.today);loadSched();}if(ds.m==='inactive'){C.roster=null;renderMore();api('coachRoster',C.pin).then(function(r){if(!guard(r))return;C.roster=r.ok?r.athletes:[];if(C.more==='inactive')renderMore();});}},
  moreBack:function(){C.more='';C.err='';renderMore();},
  schedWeek:function(ds){C.schedMonday=addDays(C.schedMonday,Number(ds.n));C.sched=null;renderMore();loadSched();},
  schedDay:function(ds){
    var x=C.sched.days.filter(function(y){return y.date===ds.d;})[0];
    openSheet('<h3>'+E(x.dow)+', '+E(nice(x.date).replace(/^\w+, /,''))+'</h3><p>'+(x.slot==='off'?'No practice':'Practice '+E(t12(x.start))+'–'+E(t12(x.end)))+'</p>'+
      '<div class="grid2"><button class="btn ok" data-a="setDay" data-d="'+E(x.date)+'" data-s="early">Early · '+E(t12(C.sched.early))+'</button><button class="btn" style="background:#b56f00" data-a="setDay" data-d="'+E(x.date)+'" data-s="late">Late · '+E(t12(C.sched.late))+'</button></div>'+
      '<label class="l" for="cst" style="margin-top:14px">Other start time</label><div class="wrow" style="margin:0"><div><input id="cst" class="field" type="time" value="'+E(x.slot==='custom'?x.start:'')+'"></div><button class="btn sec" data-a="setDay" data-d="'+E(x.date)+'" data-s="custom">Set</button></div>'+
      '<label class="l" for="snote" style="margin-top:14px">Note (optional)</label><input id="snote" class="field" maxlength="80" placeholder="Thanksgiving week, tournament…" value="'+E(x.source==='set'?x.note:'')+'" style="font-size:17px;min-height:50px">'+
      '<div style="margin-top:14px"><button class="btn danger" data-a="setDay" data-d="'+E(x.date)+'" data-s="off">No practice this day</button>'+(x.source==='set'?'<button class="btn ghost" data-a="setDay" data-d="'+E(x.date)+'" data-s="default">Back to the weekly rule</button>':'')+'<button class="btn ghost" data-a="close">Cancel</button></div>');
  },
  setDay:function(ds){
    var st=(document.getElementById('cst')||{}).value||'', note=(document.getElementById('snote')||{}).value||'';
    closeSheet();
    api('coachSetDay',C.pin,ds.d,ds.s,st,note).then(function(r){ if(!guard(r))return; if(!r.ok)return toast('NOT SAVED: '+r.message,null,true); toast('Saved.'); loadSched(); C.day=null; loadDay(false,true); });
  },
  fill:function(ds){
    api('coachFillWeeks',C.pin,C.schedMonday,ds.s,4).then(function(r){ if(!guard(r))return; if(!r.ok)return toast('NOT SAVED: '+r.message,null,true); toast(r.added+' practice days added.'); loadSched(); C.day=null; loadDay(false,true); });
  },
  cfgToggle:function(ds){
    var d=C.day,k=ds.k,v='';
    renderMore();
    api('coachSetConfig',C.pin,k,v).then(function(r){ if(!guard(r))return; if(!r.ok)toast('NOT SAVED: '+r.message,null,true); loadDay(false,true); });
  },
  presence:function(ds){
    C.day.presence={Location:'loc',LocationOnly:'loconly',Code:'code',Off:'off'}[ds.v];renderMore();
    api('coachSetConfig',C.pin,'PRESENCE_CHECK',ds.v).then(function(r){ if(!guard(r))return; if(!r.ok)toast('NOT SAVED: '+r.message,null,true); else toast('Saved.'); loadDay(false,true); });
  },
  schoolAsk:function(){openSheet('<h3>Set the school location?</h3><p>Only do this while you are standing in the wrestling room. Athletes will have to be near this spot to check in.</p><button class="btn" data-a="schoolSet">I am in the wrestling room — set it</button><button class="btn ghost" data-a="close">Cancel</button>');},
  schoolSet:function(){
    closeSheet();toast('Finding your location…');
    locate().then(function(p){
      api('coachSetSchool',C.pin,p.lat,p.lng).then(function(r){ if(!guard(r))return; if(!r.ok)return toast('NOT SAVED: '+r.message,null,true); toast('School location set (accurate to about '+Math.round(p.acc*1.09361)+' yards).'); loadDay(false,true); });
    },function(why){toast(why,null,true);});
  },
  tripAnchor:function(){setTripAnchor(C.trip.view,false);},
  addSave:function(){
    var a={id:document.getElementById('aid').value.trim(),first:document.getElementById('afn').value.trim(),last:document.getElementById('aln').value.trim(),grade:document.getElementById('agr').value.trim()};
    api('coachAddAthlete',C.pin,a).then(function(r){ if(!guard(r))return; if(!r.ok){C.err=r.message;return renderMore();} C.err='';C.more='';C.day=null;renderMore();loadDay(false,true);toast(r.message||(a.first+' '+a.last+' added.')); });
  },
  print:function(){window.print();}
};
function setActive(on){
  var id=C.ath.id;
  api('coachSetActive',C.pin,id,on).then(function(r){ if(!guard(r))return; if(!r.ok)return toast('NOT SAVED: '+r.message,null,true); C.day=null;C.rep=null;toast(on?'Back on the active roster.':'Removed from the active roster.'); openAth(id); });
}
var MODE=BOOT.mode;

document.addEventListener('click',function(e){
  if(e.target===$sheet)return closeSheet();
  var el=e.target.closest?e.target.closest('[data-a]'):null; if(!el||el.disabled)return;
  var f=act[el.getAttribute('data-a')]; if(f){ if(el.tagName==='BUTTON')e.preventDefault(); f(el.dataset,el); }
});
document.addEventListener('change',function(e){
  var el=e.target,c=el.getAttribute&&el.getAttribute('data-c');
  if(el.id==='tdate'&&C.form){   // keep the date in the excused line in step with the trip date
    var x=document.getElementById('texc'),md=mdOf(el.value);
    if(x&&md){ if(!x.value.trim())x.value='Excused '+md+' for classes '; else x.value=x.value.replace(/^(\s*Excused\s+)\d{1,2}\/\d{1,2}/i,'$1'+md); }
  }
  if(!c)return;
  if(c==='cyc'){   // saved in place: the page is not redrawn, so a weight being typed is not lost
    var st=document.getElementById('cycst'); el.disabled=true; if(st){st.className='hint';st.textContent='Saving…';}
    return api('athleteCycle',A.sid,deviceId(),el.checked).then(function(r){
      if(r.me)A.me=r.me;
      if(!A.me||!A.me.cycle)return renderAthlete();
      var b=document.getElementById('cyc'),t=document.getElementById('cycst');
      if(b){b.disabled=false;b.checked=!!A.me.cycle.on;}
      if(t){t.className=r.ok?'saved':'err';t.textContent=r.ok?'Saved ✓':'NOT SAVED. '+r.message;}
    });
  }
  if(c==='wt')saveWt(el,false);
  else if(c==='cfg'){api('coachSetConfig',C.pin,el.getAttribute('data-k'),el.value).then(function(r){ if(!guard(r))return; if(!r.ok)return toast('NOT SAVED: '+r.message,null,true); toast('Saved.'); loadDay(false,true); });}
});
document.addEventListener('input',function(e){
  var i=e.target.getAttribute&&e.target.getAttribute('data-i');
  if(i==='search'){C.q=e.target.value;renderList();}
  else if(i==='ssearch'){C.sq=e.target.value;renderSessList();}
  else if(i==='psearch'&&C.form){C.form.q=e.target.value;renderPick();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&sheetOpen())return closeSheet();
  if(e.key!=='Enter')return;
  var id=e.target.id;
  if(id==='sid')act.idNext(); else if(id==='code')act.codeGo(); else if(id==='pin')act.pinGo(); else if(id==='hpin')act.cycGo();
  else if(e.target.getAttribute&&e.target.getAttribute('data-c')==='wt')e.target.blur();
});
function typing(){var a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='SELECT');}
setInterval(function(){
  if(document.hidden||sheetOpen()||typing()||C.pending>0||MODE!=='coach'||!C.pin)return;
  if(C.tab==='today'&&C.sess){if(C.sess.data&&C.sess.data.session.open)loadSess();}
  else if(C.tab==='today'&&C.day&&C.date===BOOT.today&&!C.q)loadDay(false);
  else if(C.tab==='bus'&&C.trip&&C.trip.data&&!C.form)loadTrip(C.trip.id,true);
},15000);
document.addEventListener('visibilitychange',function(){
  if(document.hidden){if(C.cyc)cycClose();return;}
  if(MODE==='athlete'&&A.sid&&A.view==='home'&&!A.busy&&!typing())athleteStart();
});

if(MODE==='poster')renderPoster(); else if(MODE==='coach')coachStart(); else athleteStart();
})();
</script>
</body>
</html>
